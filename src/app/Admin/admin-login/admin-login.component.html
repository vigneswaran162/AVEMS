<main class="login-page">
  <div class="login-card">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true"><i class="fa-solid fa-shield-halved"></i></span>
      <h1>Admin <span>Login</span></h1>
      <p>Sign in to manage events, registrations and announcements.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="alert-error" *ngIf="errorMessage" role="alert">
        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> {{ errorMessage }}
      </div>

      <div class="field">
        <label for="login-user">Username</label>
        <div class="input-wrap">
          <i class="fa-regular fa-user lead" aria-hidden="true"></i>
          <input id="login-user" type="text" class="form-control" formControlName="username" autocomplete="username"
            placeholder="username: admin" [class.is-invalid]="isInvalid('username')" autofocus>
        </div>
        <div class="field-error" *ngIf="isInvalid('username')">Username is required.</div>
      </div>

      <div class="field">
        <label for="login-pass">Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock lead" aria-hidden="true"></i>
          <input id="login-pass" [type]="showPassword ? 'text' : 'password'" class="form-control" formControlName="password"
            autocomplete="current-password" placeholder="password: YuDMon47k6X1v0" [class.is-invalid]="isInvalid('password')">
          <button type="button" class="toggle" (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            <i class="fa-regular" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
        <div class="field-error" *ngIf="isInvalid('password')">Password is required.</div>
      </div>

      <button type="submit" class="btn btn-primary submit" [disabled]="submitting">
        <span class="btn-spinner" *ngIf="submitting" aria-hidden="true"></span>
        {{ submitting ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <a routerLink="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to website</a>
  </div>
</main>
